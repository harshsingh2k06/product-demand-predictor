{% extends "base.html" %}
{% block title %}Record Sale{% endblock %}

{% block content %}
<h2 class="mb-4">Record a Live Sale</h2>
<p class="text-muted">This simulates a supermarket's billing counter saving today's sale into the database.</p>

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Product</label>
                <select name="product_id" class="form-select" required>
                    <option value="" disabled selected>-- choose a product --</option>
                    {% for p in products %}
                    <option value="{{ p['product_id'] }}">{{ p['name'] }} ({{ p['category'] }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input type="date" name="sale_date" class="form-control" value="{{ today }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price sold at (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity Sold</label>
                <input type="number" name="quantity" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Note (optional)</label>
                <input type="text" name="note" class="form-control" placeholder="e.g. festival discount">
            </div>

            <button type="submit" class="btn btn-primary">Save Sale</button>
        </form>
    </div>
</div>
{% endblock %}
